<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기가지니 A 우회 게이트</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 20px; text-align: center; }
        h1 { color: #00e676; font-size: 20px; margin-bottom: 10px; }
        p { font-size: 13px; color: #ccc; margin-bottom: 20px; }
        .btn { display: block; width: 85%; max-width: 380px; margin: 12px auto; padding: 15px; background-color: #1f1f1f; color: #00e676; text-decoration: none; border: 2px solid #00e676; border-radius: 8px; font-size: 15px; font-weight: bold; }
        .btn-down { border-color: #ff9800; color: #ff9800; }
        .sub { font-size: 11px; color: #aaa; margin-top: 4px; font-weight: normal; }
    </style>
</head>
<body>
    <h1>기가지니 A 설정 우회 게이트</h1>
    <p>아래 순서대로 눌러 브라우저 외부 탈출을 시도하십시오.</p>

    <!-- 방식 A: APK 다운로드 매니저 트리거 (가장 강력) -->
    <a class="btn btn-down" href="https://github.com/autostart/autostart/releases/download/v1.0/dummy.apk" download>
        [추천] 1. 버튼 매퍼/설정 우회용 APK 다운로드
        <div class="sub">TV Bro 다운로드 매니저 실행 ➔ 완료 후 '열기' 클릭하여 설정 진입</div>
    </a>

    <!-- 방식 B: 스토어 직접 우회 -->
    <a class="btn" href="market://details?id=flar2.homebutton">
        2. Play 스토어 앱 직접 호출
        <div class="sub">Button Mapper 스토어 페이지로 브라우저 탈출</div>
    </a>

    <!-- 방식 C: 시스템 딥링크 fallback -->
    <a class="btn" href="android-app://com.android.tv.settings">
        3. 안드로이드 TV 설정 앱 스킴 (android-app://)
        <div class="sub">Intent 규격 대신 안드로이드 앱 스킴 직접 호출</div>
    </a>
</body>
</html>
