<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기가지니 A 우회 게이트 V6</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        h1 { color: #00e676; font-size: 20px; }
        .btn { display: block; width: 85%; max-width: 350px; margin: 12px auto; padding: 15px; background: #222; color: #00e676; border: 2px solid #00e676; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>기가지니 A 우회 게이트 V6</h1>
    <p>브라우저 샌드박스 우회 (멀티 프로토콜 파이프라인)</p>

    <!-- 1. Iframe 주입 방식 (브라우저 주소창 파싱 회피) -->
    <button class="btn" onclick="triggerIframe()">1. Iframe 다이렉트 인텐트</button>

    <!-- 2. Form POST/GET 액션 방식 -->
    <form id="intentForm" action="intent:#Intent;action=android.settings.ACCESSIBILITY_SETTINGS;end" method="GET">
        <button type="submit" class="btn">2. Form Submit 우회</button>
    </form>

    <!-- 3. Chrome Custom Tab 스킴 -->
    <a class="btn" href="googlechrome://navigate?url=intent:#Intent;action=android.settings.ACCESSIBILITY_SETTINGS;end">
        3. Chrome Protocol 우회
    </a>

    <script>
        function triggerIframe() {
            // 브라우저 파서를 타지 않도록 비동기 iframe을 주입하여 OS로 직접 호출
            var iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = "intent:#Intent;action=android.settings.ACCESSIBILITY_SETTINGS;end";
            document.body.appendChild(iframe);
            
            setTimeout(function() {
                // 서브 스킴 실패 시 fallback
                window.location.href = "intent://com.android.tv.settings/#Intent;scheme=android-app;package=com.android.tv.settings;end";
            }, 500);
        }
    </script>
</body>
</html>
