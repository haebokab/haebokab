<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV 리모컨 맵핑 설정</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .btn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #6200ee;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        /* TV 리모컨으로 포커스가 갔을 때 시각적 효과 */
        .btn:focus {
            outline: 4px solid #03dac6;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>안드로이드 TV 설정 이동</h1>
    <p>아래 버튼을 눌러 리모컨 맵핑 권한(접근성/설정)을 활성화하세요.</p>

    <a href="intent:#Intent;action=android.settings.SETTINGS;end" class="btn">
        기본 설정 창 열기
    </a>

    <br><br>

    <a href="intent:#Intent;action=android.settings.ACCESSIBILITY_SETTINGS;end" class="btn">
        리모컨 맵핑(접근성) 설정 열기
    </a>

</body>
</html>
