<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기가지니 A 우회 게이트 V5</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 15px; text-align: center; }
        h1 { color: #00e676; font-size: 20px; margin-bottom: 5px; }
        p { color: #aaa; font-size: 12px; margin-bottom: 20px; }
        .btn { display: block; width: 85%; max-width: 350px; margin: 10px auto; padding: 14px; background: #222; color: #00e676; border: 2px solid #00e676; border-radius: 8px; font-size: 15px; font-weight: bold; text-decoration: none; }
        .btn:active { background: #00e676; color: #000; }
        .sub { font-size: 10px; color: #888; font-weight: normal; margin-top: 3px; }
    </style>
</head>
<body>
    <h1>기가지니 A 우회 게이트 V5</h1>
    <p>스토어 메인 및 검색창 호출 우회 루트</p>

    <!-- 1. Play 스토어 검색창 호출 (가장 안전한 경로) -->
    <a class="btn" href="market://search?q=button+mapper">
        1. 스토어 검색 화면 열기
        <div class="sub">market://search?q=button+mapper</div>
    </a>

    <!-- 2. Play 스토어 카테고리 메인 진입 -->
    <a class="btn" href="market://search?q=settings">
        2. 설정 관련 앱 검색 열기
        <div class="sub">market://search?q=settings</div>
    </a>

    <!-- 3. 안드로이드 시스템 설정 패키지 검색 (오류 방지형) -->
    <a class="btn" href="market://search?q=pname:com.android.tv.settings">
        3. TV 설정 패키지 검색
        <div class="sub">market://search?q=pname:com.android.tv.settings</div>
    </a>
</body>
</html>
