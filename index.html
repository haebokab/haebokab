<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기가지니 A 설정 우회 V3</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        h1 { color: #00e676; font-size: 20px; }
        .btn { display: block; width: 85%; max-width: 350px; margin: 12px auto; padding: 15px; background: #222; color: #00e676; border: 2px solid #00e676; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>기가지니 A 설정 우회 V3</h1>
    <p>버튼을 누르면 자바스크립트로 안드로이드 설정을 강제 호출합니다.</p>

    <!-- JS 이벤트 방식으로 변경 -->
    <button class="btn" onclick="openAccessibility()">1. 접근성 설정 열기 (JS)</button>
    <button class="btn" onclick="openSettings()">2. 전체 설정 열기 (JS)</button>
    <button class="btn" onclick="openApps()">3. 앱 관리 열기 (JS)</button>

    <script>
        function openAccessibility() {
            // 안드로이드 OS 표준 접근성 액션 호출
            window.location.href = "intent:#Intent;action=android.settings.ACCESSIBILITY_SETTINGS;end";
        }
        function openSettings() {
            // 기본 전체 설정 호출
            window.location.href = "intent:#Intent;action=android.settings.SETTINGS;end";
        }
        function openApps() {
            // 앱 설정 화면 호출
            window.location.href = "intent:#Intent;action=android.settings.APPLICATION_SETTINGS;end";
        }
    </script>
</body>
</html>
