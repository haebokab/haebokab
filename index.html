<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기가지니 A 설정 우회 게이트</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 20px; text-align: center; }
        h1 { color: #00e676; margin-bottom: 20px; }
        .btn { display: block; width: 80%; max-width: 400px; margin: 15px auto; padding: 15px; background-color: #1f1f1f; color: #ffffff; text-decoration: none; border: 2px solid #00e676; border-radius: 8px; font-size: 18px; font-weight: bold; }
        .btn:hover { background-color: #00e676; color: #000000; }
        .sub { font-size: 12px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>기가지니 A 설정 우회 게이트</h1>
    <p>아래 버튼을 누르면 안드로이드 TV 내부 설정으로 진입합니다.</p>
    <hr style="border-color: #333; margin: 20px 0;">

    <!-- 1. 접근성 설정 (버튼 매핑 필수 경로) -->
    <a class="btn" href="intent://com.android.tv.settings/.accessibility.AccessibilitySettingsActivity#Intent;scheme=android-app;end">
        1. 접근성 설정 진입
        <div class="sub">Button Mapper 권한 허용용 (최우선 실행)</div>
    </a>

    <!-- 2. 안드로이드 전체 설정 -->
    <a class="btn" href="intent://com.android.tv.settings/#Intent;scheme=android-app;end">
        2. 전체 시스템 설정 진입
        <div class="sub">기기 정보, 계정, 디스플레이 등 메인 설정</div>
    </a>

    <!-- 3. 앱 목록 관리 -->
    <a class="btn" href="intent://com.android.tv.settings/.applications.ApplicationsActivity#Intent;scheme=android-app;end">
        3. 전체 앱 목록 관리
        <div class="sub">설치된 앱 강제 종료 및 정보 확인</div>
    </a>

    <!-- 4. 개발자 옵션 (열려있을 경우) -->
    <a class="btn" href="intent://com.android.tv.settings/.development.DevelopmentSettingsActivity#Intent;scheme=android-app;end">
        4. 개발자 옵션 진입
        <div class="sub">ADB 및 디버깅 옵션</div>
    </a>
</body>
</html>
